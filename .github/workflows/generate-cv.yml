name: Generate CV PDF

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/cv-source.html'
      - '.github/workflows/generate-cv.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install WeasyPrint
        run: python -m pip install --disable-pip-version-check --no-cache-dir weasyprint==68.0

      - name: Fetch profile photo
        run: curl -fsSL 'https://raw.githubusercontent.com/AgusDelgado98/agustin-personal-site/main/assets/agustin-photo.jpg' -o tools/cv_photo.png

      - name: Generate CV
        run: |
          python - <<'PY'
          from weasyprint import HTML
          HTML(filename='tools/cv-source.html', base_url='tools').write_pdf('public/cv/Agustín Delgado 2026.pdf')
          PY

      - name: Commit generated CV
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'public/cv/Agustín Delgado 2026.pdf'
          if git diff --cached --quiet; then
            echo 'CV is already up to date.'
          else
            git commit -m 'chore(cv): regenerate Agustín Delgado 2026 PDF'
            git push
          fi
