<!DOCTYPE html>

  <head>
    <meta charset="UTF-8" />
    <script>
      // First paint matches App.jsx: Home, Projects, a project page, About
      // (including #about/<section>) and Contact are dark. A case study
      // (#projects/<id>/<case>) stays on paper. Legacy About aliases are dark
      // for the one frame before they normalize.
      var hash = location.hash || ''
      var dark = hash === '' || hash === '#' || hash === '#home' || hash === '#projects' || hash === '#about' || hash === '#contact'
        || /^#projects\/[^/]+$/.test(hash)
        || /^#about\/[^/]+$/.test(hash)
        || hash === '#data-bi' || hash === '#stack' || hash === '#operations' || hash === '#formacion' || hash === '#enfoque'
      document.documentElement.dataset.surface = dark ? 'dark' : 'paper'
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts load without blocking the first paint: the page renders with the fallback faces
         (display=swap) and switches when they arrive. Same families, same weights as before. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" />
